name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.1.2)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check release version
        run: |
          node --input-type=commonjs -e 'const assert = require("node:assert/strict"); assert.equal(process.env.RELEASE_TAG, `v${require("./package.json").version}`)'
      - run: npm ci --no-audit
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:csp

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Check release version
        run: |
          node --input-type=commonjs -e 'const assert = require("node:assert/strict"); assert.equal(process.env.RELEASE_TAG, `v${require("./package.json").version}`)'
      - run: npm ci --no-audit
      - run: npm run build
      - run: npm install --global npm@11
      - run: npm publish --access public ./dist
